<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的導航清單 - 極簡版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto+Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .list-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.15s ease;
        }

        .list-item:active {
            transform: scale(0.985);
            background: rgba(51, 65, 85, 0.7);
        }

        .search-input:focus {
            background-color: rgba(30, 41, 59, 0.8);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 主容器 -->
    <div class="max-w-2xl mx-auto w-full px-4 py-6 flex-grow">
        
        <!-- 頂部簡單標題 -->
        <header class="mb-6 flex justify-between items-end px-1">
            <div>
                <h1 class="text-xl font-bold text-white">快速導航</h1>
                <p class="text-slate-500 text-xs">Quick Access</p>
            </div>
            <div class="text-slate-600 text-[10px] font-mono uppercase tracking-widest">
                Personal Index
            </div>
        </header>

        <!-- 搜尋功能 - 更緊湊 -->
        <div class="relative mb-5">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
            <input type="text" id="searchInput" placeholder="快速過濾..." 
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/40 border border-slate-700/50 text-sm text-white placeholder-slate-600 focus:outline-none search-input transition-all">
        </div>

        <!-- 分類橫向捲動 -->
        <div class="flex gap-1.5 mb-5 overflow-x-auto no-scrollbar">
            <button class="category-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs font-medium bg-blue-600 text-white shadow-lg shadow-blue-900/20" data-category="all">全部</button>
            <button class="category-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-400" data-category="work">工作</button>
            <button class="category-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-400" data-category="ai">AI</button>
            <button class="category-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-400" data-category="design">設計</button>
            <button class="category-btn whitespace-nowrap px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-400" data-category="entertainment">娛樂</button>
        </div>

        <!-- 極簡連結清單 -->
        <div id="linkGrid" class="space-y-2">
            <!-- 連結項目 -->
        </div>

        <!-- 無結果 -->
        <div id="noResults" class="hidden text-center py-12">
            <p class="text-slate-600 text-sm">找不到相關連結</p>
        </div>

    </div>

    <!-- 頁腳 -->
    <footer class="py-6 text-center text-slate-700 text-[10px] uppercase tracking-tighter">
        <p>Stay Efficient · 2024</p>
    </footer>

    <script>
        const links = [
            { title: "Google", url: "https://www.google.com", description: "搜尋引擎", category: "work", icon: "search" },
            { title: "ChatGPT", url: "https://chatgpt.com", description: "AI 對話", category: "ai", icon: "message-square" },
            { title: "Claude AI", url: "https://claude.ai", description: "AI 助手", category: "ai", icon: "cpu" },
            { title: "Notion", url: "https://www.notion.so", description: "工作筆記", category: "work", icon: "file-text" },
            { title: "YouTube", url: "https://www.youtube.com", description: "影片平台", category: "entertainment", icon: "youtube" },
            { title: "GitHub", url: "https://github.com", description: "代碼託管", category: "work", icon: "github" },
            { title: "Canva", url: "https://www.canva.com", description: "線上設計", category: "design", icon: "palette" },
            { title: "Netflix", url: "https://www.netflix.com", description: "影音串流", category: "entertainment", icon: "tv" },
            { title: "Gmail", url: "https://mail.google.com", description: "郵件收發", category: "work", icon: "mail" }
        ];

        const linkGrid = document.getElementById('linkGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const categoryBtns = document.querySelectorAll('.category-btn');

        let currentCategory = 'all';
        let searchQuery = '';

        function renderLinks() {
            const filteredLinks = links.filter(link => {
                const matchesSearch = link.title.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = currentCategory === 'all' || link.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            linkGrid.innerHTML = '';
            
            if (filteredLinks.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                filteredLinks.forEach(link => {
                    const item = document.createElement('a');
                    item.href = link.url;
                    item.target = "_blank";
                    // 調整為 py-2.5 以降低高度
                    item.className = "list-item flex items-center py-2.5 px-4 rounded-xl w-full group";
                    item.innerHTML = `
                        <div class="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center mr-3 shrink-0 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                            <i data-lucide="${link.icon || 'link'}" class="w-4 h-4"></i>
                        </div>
                        <div class="flex-grow min-w-0 flex items-baseline gap-2">
                            <h3 class="text-[14px] font-semibold text-slate-100 truncate">${link.title}</h3>
                            <span class="text-[11px] text-slate-500 truncate font-normal border-l border-slate-700 pl-2 group-hover:text-slate-400">${link.description}</span>
                        </div>
                        <div class="ml-2 text-slate-700 group-hover:text-slate-400 transition-colors">
                            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                        </div>
                    `;
                    linkGrid.appendChild(item);
                });
            }
            lucide.createIcons();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLinks();
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryBtns.forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-900/20');
                    b.classList.add('bg-slate-800', 'text-slate-400');
                });
                btn.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-900/20');
                btn.classList.remove('bg-slate-800', 'text-slate-400');
                
                currentCategory = btn.getAttribute('data-category');
                renderLinks();
            });
        });

        window.onload = () => {
            renderLinks();
            lucide.createIcons();
        };
    </script>
</body>
</html>
